<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Wings - Find Your WINGS</title>
  <meta name="description" content="Find Your WINGS. Watch the Golden Wings documentary featuring Robyn Stewart's incredible 50+ year career as an American Airlines flight attendant.">
  <link rel="stylesheet" href="/css/styles.css">
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-KTKKLD3G');</script>
  <!-- End Google Tag Manager -->
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KTKKLD3G"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  
<div class="min-h-screen bg-gradient-to-b from-blue-900 to-blue-950 flex items-center justify-center px-4 py-12">
  <div class="max-w-5xl w-full">

    <!-- Logo -->
    <div class="text-center mb-8">
      <img src="https://imgur.com/0TQ8Vy9.png" alt="Golden Wings Logo" class="mx-auto h-24 mb-4">
      <h1 class="text-4xl font-bold text-white mb-2">Golden Wings</h1>
      <p class="text-blue-100 text-xl font-semibold mb-1">Find Your WINGS</p>
      <p class="text-blue-200 text-lg">A 50-Year Journey Through Aviation History</p>
    </div>

    <!-- Email Gate -->
    <div id="email-gate" class="bg-white/10 backdrop-blur-sm rounded-lg p-8 mb-8 border border-white/20">
      <h2 class="text-2xl font-bold text-white text-center mb-4">Access Your Screening</h2>
      <p class="text-blue-200 text-center mb-6">Enter your email to begin watching</p>

      <form id="access-form" class="max-w-md mx-auto">
        <div class="mb-4">
          <input
            type="email"
            id="viewer-email"
            name="viewer-email"
            required
            placeholder="your.email@example.com"
            class="w-full px-4 py-3 rounded-lg bg-white/90 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>

        <!-- Honeypot -->
        <div style="position: absolute; left: -9999px; opacity: 0;">
          <label for="hp-check-watch">Do not fill this field</label>
          <input type="text" id="hp-check-watch" name="hp-check-watch" tabindex="-1" autocomplete="off">
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg text-lg transition-colors duration-200 shadow-lg"
        >
          Access Screening ✈️
        </button>
      </form>
    </div>

    <!-- Video Player (hidden until email submitted) -->
    <div id="video-container" class="hidden">
      <div class="bg-black rounded-lg overflow-hidden shadow-2xl mb-8" style="aspect-ratio: 16/9;">
        <iframe
          width="100%"
          height="100%"
          src="https://www.youtube.com/embed/RzkdMRHRblU"
          title="Golden Wings Documentary"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
          class="w-full h-full"
        ></iframe>
      </div>

      <!-- Instructions -->
      <div class="text-center mb-6">
        <p class="text-white text-xl leading-relaxed">
          Welcome to the GWINGZ in-flight entertainment system.<br>
          Just push play!<br>
          Have questions?
        </p>
      </div>

      <!-- Call Button -->
      <div class="text-center">
        <a
          href="mailto:info@golden-wings-robyn.com"
          class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-4 rounded-lg text-lg transition-colors duration-200 shadow-lg"
        >
          📞 Call Button
        </a>
      </div>
    </div>

  </div>
</div>

<script>
const WEBHOOK_URL = 'https://gwingz-worker.calebmills99.workers.dev';

document.getElementById('access-form').addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('viewer-email').value;
  const honeypot = document.getElementById('hp-check-watch').value;

  if (honeypot) return;

  try {
    fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'watch_access',
        email: email,
        timestamp: new Date().toISOString(),
        page: 'watch'
      })
    }).catch(() => {});
  } catch (_) {}

  document.getElementById('email-gate').classList.add('hidden');
  document.getElementById('video-container').classList.remove('hidden');
  document.getElementById('video-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>


  <footer class="bg-gray-100 py-4 text-center text-xs">
    <div class="container mx-auto">
      <a href="https://www.golden-wings-robyn.com/privacy-policy" class="text-gray-600 hover:text-gray-900 underline">Privacy Policy</a>
      <span class="text-gray-400 mx-2">|</span>
      <a href="https://www.golden-wings-robyn.com/terms-of-use" class="text-gray-600 hover:text-gray-900 underline">Terms of Use</a>
    </div>
  </footer>
</body>
</html>

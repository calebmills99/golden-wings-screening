name = "gwingz-worker"
main = "gwingz-worker.js"
compatibility_date = "2026-02-22"

[vars]
PUBLIC_SITE_URL = "https://gwingz.com"
# open | scheduled | closed — change without rebuilding the Vue app
SCREENING_STATE = "open"
STREAM_CUSTOMER_CODE = "e46l63ee4ck01nmz"
# Silicon Beach Layover Edition — signed playback only via /watch (requireSignedURLs)
STREAM_VIDEO_UID = "800f3d6841aa40d7727886dc211e34eb"
# No SCREENING_EMBED_URL — never expose a public UID iframe for this cut
# RESEND_API_KEY should be set via `wrangler secret put RESEND_API_KEY`
# FROM_EMAIL = "info@golden-wings-robyn.com"

[stream]
binding = "STREAM"

[[d1_databases]]
binding = "AUDIENCE_DB"
database_name = "golden-wings-audience"
database_id = "71c3d1ae-169e-464e-89ed-6f240d6e5f53"
migrations_dir = "migrations"
